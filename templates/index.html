<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bovine Breed Classifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Live Bovine Breed Classifier</h1>
        <p>Point your webcam at a bovine to identify its breed.</p>
        <div class="video-container">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <h2 id="prediction">Prediction: Waiting for feed...</h2>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const predictionText = document.getElementById('prediction');
        const constraints = { video: { width: 640, height: 480 } };

        // 1. Access Webcam
        navigator.mediaDevices.getUserMedia(constraints)
            .then((stream) => {
                video.srcObject = stream;
            })
            .catch((err) => {
                console.error("Error accessing webcam: ", err);
                predictionText.innerText = "Error: Could not access webcam.";
            });

        // 2. Send frames to the server for prediction every second
        setInterval(() => {
            // Create a canvas to capture a frame from the video
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convert the canvas image to a base64 data URL
            const imageData = canvas.toDataURL('image/jpeg');

            // Use fetch to send the image data to the Flask backend
            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ image: imageData }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.breed) {
                    // Update the prediction text on the page
                    predictionText.innerText = `Prediction: ${data.breed} (${data.confidence}%)`;
                }
            })
            .catch(error => {
                console.error('Error during prediction:', error);
            });
        }, 1000); // Send a frame every 1000 ms (1 second)
    </script>
</body>
</html>
